authors="Pixel"
description='''
Create: Ordnance is a comprehensive ballistics addon for the Create mod.
It provides a modular, data-driven system for projectile assembly and physics simulation, including:
- Modular Projectile Assembly (Payloads, Propulsion, Guidance)
- Realistic Physics (Drag, Gravity, Lift, Buoyancy)
- Server-side simulation with client-side interpolation
- Extensible API for custom modules
'''

